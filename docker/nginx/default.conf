# Docker Compose 重建服务时会为新容器分配新 IP。Nginx 默认只在加载配置时解析一次服务名，
# 会继续访问旧 IP 并返回 502；127.0.0.11 是 Docker 容器网络内置 DNS，用于定期刷新服务地址。
resolver 127.0.0.11 valid=10s ipv6=off;

# `docmind_api_upstream` 表示主站 API 的 Nginx 上游服务组。
upstream docmind_api_upstream {
    # 运行时 DNS 更新需要共享内存保存上游状态，确保所有 Nginx worker 使用同一最新地址。
    zone docmind_api_upstream 64k;
    # `resolve` 让 Nginx 在运行期间重新解析 Compose 服务名，不能改为易变的容器 IP。
    server api:5050 resolve;
}

# `docmind_chat_iframe_upstream` 表示主站转发嵌入页请求时使用的 Nginx 上游服务组。
upstream docmind_chat_iframe_upstream {
    # chat-iframe 容器也可能被独立重建，因此同样共享并动态更新它的服务地址。
    zone docmind_chat_iframe_upstream 64k;
    server chat-iframe:80 resolve;
}

server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    location = /chat-iframe {
        return 301 /chat-iframe/;
    }

    location /chat-iframe/ {
        # 主站 Nginx 只负责统一入口；保留原始路径交给 chat-iframe 静态服务处理。
        proxy_pass http://docmind_chat_iframe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://docmind_api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}
