# API 容器重建后 IP 可能变化。Nginx 默认只在加载配置时解析一次服务名，
# 会继续访问旧 IP 并返回 502；127.0.0.11 是 Docker 容器网络内置 DNS，用于定期刷新服务地址。
resolver 127.0.0.11 valid=10s ipv6=off;

# `docmind_api_upstream` 表示 chat-iframe 调用 DocMind API 时使用的 Nginx 上游服务组。
upstream docmind_api_upstream {
    # 运行时 DNS 更新需要共享内存保存上游状态，确保所有 Nginx worker 使用同一最新地址。
    zone docmind_api_upstream 64k;
    # `resolve` 让 Nginx 在运行期间重新解析 Compose 服务名，不能改为易变的容器 IP。
    server api:5050 resolve;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    client_max_body_size 20M;

    location = /chat-iframe {
        return 301 /chat-iframe/;
    }

    # 入口 HTML 负责引用带哈希的资源文件；若它被浏览器沿用旧缓存，更新后的
    # 聊天功能不会生效。仅禁止缓存入口，静态资源仍可由文件名哈希安全复用缓存。
    location = /chat-iframe/index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 父页面通过固定 URL 引用 SDK；如果 SDK 沿用旧缓存，SDK 内的 iframe 入口更新逻辑本身也无法生效。
    location = /chat-iframe/docmind-chat-iframe-parent.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /chat-iframe/ {
        # 静态托管：iframe 是前端单页应用，刷新内部路径时需要回退到 index.html。
        try_files $uri $uri/ /chat-iframe/index.html;
    }

    location /api/ {
        # 默认经动态上游转发；独立部署时仍使用 Docker 网络可解析的 API 服务名或域名。
        proxy_pass http://docmind_api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # 独立部署与主站入口保持相同超时，避免上传或长时间流式回答被提前切断。
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # SSE 必须关闭代理缓冲，才能把运行事件及时送到浏览器。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
