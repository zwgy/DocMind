server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    client_max_body_size 20M;

    location = /chat-iframe {
        return 301 /chat-iframe/;
    }

    location /chat-iframe/ {
        # 静态托管：iframe 是前端单页应用，刷新内部路径时需要回退到 index.html。
        try_files $uri $uri/ /chat-iframe/index.html;
    }

    location /api/ {
        # 反向代理：默认按 docMind docker-compose 内部服务名转发；独立部署时替换为实际后端地址。
        proxy_pass http://api:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # 独立部署与主站入口保持相同超时，避免上传或长时间流式回答被提前切断。
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # SSE 必须关闭代理缓冲，才能把运行事件及时送到浏览器。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
